[package]
name = "twr"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Agent-first Rust CLI for X/Twitter over cookie-authenticated GraphQL"
default-run = "twr"

[[bin]]
name = "twr"
path = "src/main.rs"

[dependencies]
twr-core = { path = "../twr-core" }
twr-client = { path = "../twr-client" }
twr-auth = { path = "../twr-auth" }
twr-config = { path = "../twr-config" }
twr-graphql = { path = "../twr-graphql" }
twr-tx = { path = "../twr-tx" }
twr-model = { path = "../twr-model" }
twr-filter = { path = "../twr-filter" }
clap = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
serde_yaml = { workspace = true }
anyhow = { workspace = true }
tokio = { workspace = true }
