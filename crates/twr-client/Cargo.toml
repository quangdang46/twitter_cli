[package]
name = "twr-client"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Transport-abstracted client for X's internal GraphQL surface (see PLAN.md §4/§7)"

[dependencies]
twr-core = { path = "../twr-core" }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
async-trait = { workspace = true }
wreq = { version = "0.15.3", features = ["cookies", "gzip"] }
wreq-util = { version = "0.1", features = ["emulation"] }

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }
anyhow = { workspace = true }
twr-auth = { path = "../twr-auth" }
twr-graphql = { path = "../twr-graphql" }
twr-model = { path = "../twr-model" }
