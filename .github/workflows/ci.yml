name: CI
on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]
env:
  CARGO_TERM_COLOR: always
jobs:
  check:
    name: Check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets --all-features --workspace -- -D warnings
      - run: cargo test --workspace --all-features
      # i8s regression guard: debug --help once overflowed the Windows
      # main-thread stack (clap ~60-variant enum). The parse now runs on a
      # 16MB-stack thread; this smoke catches any regression on all OSes
      # (cargo run is portable across shells — no .exe suffix handling).
      - run: cargo run -p twr -- --help > /dev/null
