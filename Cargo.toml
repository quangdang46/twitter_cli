[workspace]
resolver = "2"
members = [
    "crates/twr",
    "crates/twr-core",
    "crates/twr-client",
    "crates/twr-tx",
    "crates/twr-auth",
]
exclude = ["tmp"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
tokio = { version = "1", features = ["full"] }
clap = { version = "4", features = ["derive", "env"] }
clap_complete = "4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
thiserror = "2"
anyhow = "1"
async-trait = "0.1"
regex = "1"
sha2 = "0.10"
base64 = "0.22"
rand = "0.8"
